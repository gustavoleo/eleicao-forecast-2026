name: Validate election model
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          ANOFOX_INTEGRATION: '1'
          DATAZOO_DISABLE_TELEMETRY: '1'
      # HTTP/Postman integration is separately evidenced locally and skips without POSTMAN_SIM_URL.
